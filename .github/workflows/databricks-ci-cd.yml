name: Databricks CI/CD

on:
  push:
    branches:
      - "feature/**"
      - "dev"
      - "main"
  pull_request:
    branches:
      - "dev"
      - "main"

jobs:
  validate-and-test:
    name: Validate bundle and run checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target dev

      - name: Python syntax check
        run: |
           python -m compileall -q src

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyspark==3.5.3

      - name: Run local unit check
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          from src.utils.chunk_io import reconcile_chunks
          passed, message = reconcile_chunks(100, {'a': 60, 'b': 40})
          assert passed, message
          print('chunk_io unit check passed')
          "

  deploy-dev:
    name: Deploy bundle and run VStone end-to-end Job
    needs: validate-and-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target dev

      - name: Run VStone end-to-end Job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle run vstone_end_to_end_job --target dev